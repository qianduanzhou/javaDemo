version: '3.8'

services:
  # MySQL 服务
  mysql:
    image: mysql:5.7
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "2206:3306"
    networks:
      - my-network
    volumes:
      - /usr/local/mysql-docker:/var/lib/mysql

  # Redis 服务
  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    networks:
      - my-network

  # Spring Boot 应用服务
  springboot-app:
    build:
      context: .
      dockerfile: Dockerfile # 指定Dockerfile路径，默认是当前目录下的 Dockerfile
    container_name: springboot-app
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - redis
    networks:
      - my-network

networks:
  my-network:
    driver: bridge